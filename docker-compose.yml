services:
  api:
    build: .
    container_name: lifevideo_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: sh scripts/start.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lifevideo_net
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: lifevideo_postgres
    ports:
      - "54325:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifevideo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifevideo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lifevideo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifevideo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lifevideo_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lifevideo_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lifevideo_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  lifevideo_net:
    driver: bridge
